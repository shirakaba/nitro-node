packages:
  - packages/*
  - demos/*

catalog:
  cmake-js: ^8.0.0
  "@tsconfig/node24": ^24.0.5
  "@types/node": ^24.13.6
  # Places the npm package `typescript`, which provides `tsc` v7,
  # into node_modules/@typescript/native. We can call this for all typechecking.
  "@typescript/native": npm:typescript@^7.0.2
  typescript: npm:@typescript/typescript6@^6.0.2

minimumReleaseAgeExclude:
  - expo-desktop-config-plugins@1.3.2
  - expo-desktop-prebuild-config@1.1.3
  - expo-desktop-template-bare-minimum@55.83.10
  - expo-desktop@1.0.6

nodeLinker: hoisted

patchedDependencies:
  "@expo/cli@55.0.37": patches/@expo__cli@55.0.37.patch
  "@react-native-windows/cli@0.83.2": patches/@react-native-windows/cli@0.83.2.patch
  nitro-core@1.0.0-alpha.nightly.100.g107f6fc66597: patches/nitro-core@1.0.0-alpha.nightly.100.g107f6fc66597.patch
  react-native-macos@0.83.0: patches/react-native-macos@0.83.0.patch
  react-native@0.83.10: patches/react-native@0.83.10.patch
